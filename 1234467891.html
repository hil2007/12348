<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apple (Taiwan)</title>
    <style>
        /* CSS Reset & 全局樣式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 1. 毛玻璃導覽列 (Global Navigation) */
        .apple-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        }

        .nav-content {
            max-width: 1024px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .nav-logo svg {
            fill: #f5f5f7;
            display: block;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        .nav-menu a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            letter-spacing: -0.01em;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: #ffffff;
        }

        /* 2. 產品焦點區塊 (Hero Section) */
        .hero-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: 100px;
            padding-bottom: 60px;
            min-height: 100vh;
            background-color: #000000;
        }

        .eyebrow {
            color: #f56300;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .hero-headline {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.005em;
            margin-bottom: 6px;
        }

        .hero-subhead {
            font-size: 24px;
            color: #86868b;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .cta-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 11px 21px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 400;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0, 0, 0.58, 1);
        }

        .btn-primary {
            background-color: #0071e3;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #0077ed;
        }

        .btn-outline {
            background-color: transparent;
            color: #2997ff;
            border: 1px solid #2997ff;
        }

        .btn-outline:hover {
            background-color: #2997ff;
            color: #ffffff;
        }

        .hero-media {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            padding: 0 20px;
        }

        .hero-media img {
            width: 100%;
            height: auto;
            border-radius: 18px;
            object-fit: cover;
        }

        /* 響應式微調 (RWD) */
        @media (max-width: 768px) {
            .nav-menu {
                display: none; /* 手機端通常會切換為漢堡選單 */
            }
            .hero-headline {
                font-size: 40px;
            }
            .hero-subhead {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <nav class="apple-nav">
        <div class="nav-content">
            <a href="#" class="nav-logo" aria-label="Apple">
                <svg height="44" viewBox="0 0 17 44" width="17">
                    <path d="M15.07 25.25c-.03-3.4 2.78-5.04 2.91-5.12-1.58-2.31-4.04-2.62-4.92-2.66-2.1-.21-4.11 1.24-5.17 1.24-1.07 0-2.72-1.21-4.47-1.18-2.3.03-4.42 1.33-5.6 3.39-2.39 4.14-.61 10.28 1.71 13.62 1.13 1.63 2.48 3.46 4.25 3.39 1.71-.07 2.35-1.1 4.41-1.1 2.06 0 2.64 1.1 4.44 1.07 1.83-.03 2.99-1.66 4.11-3.3 1.3-1.9 1.83-3.74 1.86-3.83-.04-.02-3.57-1.37-3.53-5.52zM11.97 15.65c.95-1.15 1.59-2.75 1.41-4.35-1.37.06-3.03.91-4.01 2.06-.88 1.02-1.65 2.66-1.44 4.22 1.53.12 3.09-.78 4.04-1.93z"/>
                </svg>
            </a>
            <ul class="nav-menu">
                <li><a href="#store">商店</a></li>
                <li><a href="#mac">Mac</a></li>
                <li><a href="#ipad">iPad</a></li>
                <li><a href="#iphone">iPhone</a></li>
                <li><a href="#watch">Watch</a></li>
                <li><a href="#support">支援服務</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主展示區塊 -->
    <main>
        <section class="hero-card">
            <div class="hero-copy">
                <span class="eyebrow">全新推出</span>
                <h1 class="hero-headline">iPhone Pro</h1>
                <p class="hero-subhead">鈦金屬打造，強大效能重磅登場。</p>
                
                <div class="cta-group">
                    <a href="#learn-more" class="btn btn-primary">進一步了解</a>
                    <a href="#buy" class="btn btn-outline">購買</a>
                </div>
            </div>
            
            <div class="hero-media">
                <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=1200&auto=format&fit=crop" alt="iPhone Pro Showcase">
            </div>
        </section>
    </main>

</body>
</html>
