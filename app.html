<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智記帳 SmartExpense - 智慧個人理財助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 pb-12">

    <!-- Header Navbar -->
    <header class="sticky top-0 z-40 w-full glass-card border-b border-slate-200 dark:border-slate-800 shadow-sm mb-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-sky-500/20">
                    <i class="fa-solid font-bold fa-wallet"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent">智記帳 SmartExpense</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">智慧理財與收支追蹤</p>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="btnSampleData" class="px-3 py-1.5 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg transition" title="載入測試資料">
                    <i class="fa-solid fa-vial mr-1"></i><span class="hidden sm:inline">載入範例</span>
                </button>
                <button id="themeToggleBtn" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                </button>
                <button id="btnOpenAddModal" class="flex items-center space-x-1 bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md shadow-sky-600/30 transition hover:scale-[1.02] active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>新增記帳</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">

        <!-- Top Summary Cards -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Total Income -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60 relative overflow-hidden group">
                <div class="absolute right-3 top-3 w-12 h-12 bg-emerald-500/10 rounded-full flex items-center justify-center text-emerald-500 text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>
                <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">本月總收入</p>
                <h2 id="summaryIncome" class="text-2xl sm:text-3xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-2">NT$ 0</h2>
                <div class="mt-2 text-xs text-slate-400 flex items-center space-x-1">
                    <span id="incomeCount">0 筆記錄</span>
                </div>
            </div>

            <!-- Total Expense -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60 relative overflow-hidden group">
                <div class="absolute right-3 top-3 w-12 h-12 bg-rose-500/10 rounded-full flex items-center justify-center text-rose-500 text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
                <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">本月總支出</p>
                <h2 id="summaryExpense" class="text-2xl sm:text-3xl font-extrabold text-rose-600 dark:text-rose-400 mt-2">NT$ 0</h2>
                <div class="mt-2 text-xs text-slate-400 flex items-center space-x-1">
                    <span id="expenseCount">0 筆記錄</span>
                </div>
            </div>

            <!-- Net Balance -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60 relative overflow-hidden group">
                <div class="absolute right-3 top-3 w-12 h-12 bg-sky-500/10 rounded-full flex items-center justify-center text-sky-500 text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>
                <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">本月淨收支</p>
                <h2 id="summaryNet" class="text-2xl sm:text-3xl font-extrabold text-sky-600 dark:text-sky-400 mt-2">NT$ 0</h2>
                <div class="mt-2 text-xs text-slate-400 flex items-center space-x-1">
                    <span id="savingsRate">儲蓄率 0%</span>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Expense Trend Chart (2 cols) -->
            <div class="lg:col-span-2 glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col justify-between">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200/50 dark:border-slate-800/50 gap-2">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-chart-line text-sky-500"></i>
                        <h3 class="font-bold text-base">收支趨勢圖</h3>
                    </div>
                    <div class="flex items-center space-x-2">
                        <select id="chartPeriodSelect" class="bg-slate-100 dark:bg-slate-800 text-xs font-medium px-3 py-1.5 rounded-lg border-0 focus:ring-2 focus:ring-sky-500">
                            <option value="month" selected>近30天趨勢</option>
                            <option value="year">近12個月趨勢</option>
                        </select>
                    </div>
                </div>
                <div class="relative w-full h-64 mt-4">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Category Pie Chart (1 col) -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60 flex flex-col justify-between">
                <div class="flex items-center justify-between pb-4 border-b border-slate-200/50 dark:border-slate-800/50">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-chart-pie text-indigo-500"></i>
                        <h3 class="font-bold text-base">支出類別佔比</h3>
                    </div>
                </div>
                <div class="relative w-full h-64 mt-4 flex items-center justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </section>

        <section class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200/50 dark:border-slate-800/50 gap-2">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bullseye text-amber-500"></i>
                    <h3 class="font-bold text-base">本月預算監控</h3>
                </div>
                <button id="btnSetBudget" class="text-xs font-medium text-sky-600 dark:text-sky-400 hover:underline flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>設定總預算</span>
                </button>
            </div>

            <div class="mt-4 space-y-4">
                <div>
                    <div class="flex justify-between items-center text-sm mb-1">
                        <span class="font-medium text-slate-700 dark:text-slate-300">本月總支出預算使用度</span>
                        <span id="budgetPercentText" class="font-bold text-sky-600 dark:text-sky-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-700 h-3 rounded-full overflow-hidden">
                        <div id="budgetProgressBar" class="h-full bg-sky-500 transition-all duration-500 w-0"></div>
                    </div>
                    <div class="flex justify-between text-xs text-slate-500 mt-1.5">
                        <span id="budgetCurrentExpense">已支出: NT$ 0</span>
                        <span id="budgetTotalAmount">目標預算: NT$ 50,000</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="glass-card rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-800/60 space-y-4">
            <!-- Section Title & Data Actions -->
            <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-200/50 dark:border-slate-800/50 pb-4 gap-4">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-sky-500"></i>
                    <h3 class="font-bold text-base">交易明細列表</h3>
                    <span id="totalFilterCount" class="bg-sky-100 dark:bg-sky-900/50 text-sky-700 dark:text-sky-300 text-xs px-2.5 py-0.5 rounded-full font-semibold">0 筆</span>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="btnExportJSON" class="px-3 py-1.5 text-xs font-medium bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg transition flex items-center space-x-1">
                        <i class="fa-solid fa-file-export"></i>
                        <span>匯出 JSON</span>
                    </button>
                    <button id="btnExportCSV" class="px-3 py-1.5 text-xs font-medium bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg transition flex items-center space-x-1">
                        <i class="fa-solid fa-file-csv"></i>
                        <span>匯出 CSV</span>
                    </button>
                    <label class="px-3 py-1.5 text-xs font-medium bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg transition flex items-center space-x-1 cursor-pointer">
                        <i class="fa-solid fa-file-import"></i>
                        <span>匯入備份</span>
                        <input type="file" id="importFileInput" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Search & Filters Toolbar -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <!-- Search input -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="搜尋備註或類別..." class="w-full pl-8 pr-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <!-- Type Filter -->
                <select id="filterType" class="py-2 px-3 text-xs bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    <option value="all">所有類型 (收入 + 支出)</option>
                    <option value="expense">單純支出</option>
                    <option value="income">單純收入</option>
                </select>

                <!-- Category Filter -->
                <select id="filterCategory" class="py-2 px-3 text-xs bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    <option value="all">所有類別</option>
                    <!-- Populated via JS -->
                </select>

                <!-- Month Filter -->
                <input type="month" id="filterMonth" class="py-2 px-3 text-xs bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <!-- Transaction List Table / Cards -->
            <div class="overflow-x-auto rounded-xl border border-slate-200/60 dark:border-slate-800/60">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 border-b border-slate-200/60 dark:border-slate-800/60 uppercase">
                        <tr>
                            <th class="py-3 px-4 font-semibold">日期</th>
                            <th class="py-3 px-4 font-semibold">類別</th>
                            <th class="py-3 px-4 font-semibold hidden sm:table-cell">支付方式</th>
                            <th class="py-3 px-4 font-semibold">備註說明</th>
                            <th class="py-3 px-4 font-semibold text-right">金額</th>
                            <th class="py-3 px-4 font-semibold text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="transactionListTable" class="divide-y divide-slate-100 dark:divide-slate-800">
                        <!-- Populated by Javascript -->
                    </tbody>
                </table>
                <div id="emptyState" class="hidden text-center py-12">
                    <i class="fa-solid fa-receipt text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                    <p class="text-slate-500 dark:text-slate-400 text-sm">尚無任何記帳資料，開始記下一筆吧！</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Add / Edit Modal -->
    <div id="transactionModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden transition-opacity">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md p-6 shadow-xl border border-slate-200 dark:border-slate-800 relative scale-95 transition-transform duration-200">
            <button id="btnCloseModal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modalTitle" class="text-lg font-bold mb-4">新增記帳項目</h3>

            <form id="transactionForm" class="space-y-4">
                <input type="hidden" id="editIndex" value="-1">

                <!-- Type Selector Tabs -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <button type="button" id="tabExpense" class="py-2 rounded-lg font-semibold text-xs text-center transition bg-white dark:bg-slate-700 shadow text-rose-600 dark:text-rose-400">
                        <i class="fa-solid fa-minus-circle mr-1"></i>支出
                    </button>
                    <button type="button" id="tabIncome" class="py-2 rounded-lg font-semibold text-xs text-center transition text-slate-500 dark:text-slate-400">
                        <i class="fa-solid fa-plus-circle mr-1"></i>收入
                    </button>
                </div>
                <input type="hidden" id="formType" value="expense">

                <!-- Amount Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">金額 (NT$)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400 font-bold">$</span>
                        <input type="number" id="formAmount" min="0" step="1" required placeholder="0" class="w-full pl-8 pr-3 py-2 text-lg font-bold bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <!-- Category Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">類別</label>
                    <select id="formCategory" class="w-full py-2 px-3 text-sm bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <!-- Populated dynamically based on type -->
                    </select>
                </div>

                <!-- Date & Payment Method Row -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">日期</label>
                        <input type="date" id="formDate" required class="w-full py-2 px-3 text-xs bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">支付/收款管道</label>
                        <select id="formPayment" class="w-full py-2 px-3 text-xs bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                            <option value="現金">現金</option>
                            <option value="信用卡">信用卡</option>
                            <option value="銀行轉帳">銀行轉帳</option>
                            <option value="LINE Pay">LINE Pay</option>
                            <option value="悠遊卡">悠遊卡</option>
                        </select>
                    </div>
                </div>

                <!-- Description Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">備註 / 說明</label>
                    <input type="text" id="formNote" placeholder="例如：午餐、薪水、買衣服..." class="w-full py-2 px-3 text-sm bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm rounded-xl shadow-md transition">
                    儲存交易記錄
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm opacity-0 pointer-events-none transition-all duration-300 transform translate-y-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">操作成功</span>
    </div>

    <script>
        // Define Categories and Icons
        const CATEGORIES = {
            expense: [
                { name: '餐飲食品', icon: 'fa-utensils', color: '#ef4444' },
                { name: '交通出行', icon: 'fa-bus', color: '#f97316' },
                { name: '休閒娛樂', icon: 'fa-gamepad', color: '#8b5cf6' },
                { name: '購物消費', icon: 'fa-bag-shopping', color: '#ec4899' },
                { name: '居住水電', icon: 'fa-house', color: '#3b82f6' },
                { name: '醫療健康', icon: 'fa-notes-medical', color: '#10b981' },
                { name: '教育學習', icon: 'fa-graduation-cap', color: '#06b6d4' },
                { name: '其他支出', icon: 'fa-ellipsis', color: '#64748b' }
            ],
            income: [
                { name: '工作薪資', icon: 'fa-money-bill-wave', color: '#10b981' },
                { name: '副業兼職', icon: 'fa-laptop-code', color: '#06b6d4' },
                { name: '投資理財', icon: 'fa-chart-line', color: '#3b82f6' },
                { name: '紅利獎金', icon: 'fa-gift', color: '#f59e0b' },
                { name: '其他收入', icon: 'fa-coins', color: '#8b5cf6' }
            ]
        };

        // App State
        let transactions = JSON.parse(localStorage.getItem('smart_expense_data')) || [];
        let monthlyBudget = parseFloat(localStorage.getItem('smart_expense_budget')) || 50000;
        let trendChartInstance = null;
        let categoryChartInstance = null;

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            setDefaultMonthFilter();
            renderCategoryOptions();
            renderFilterCategoryOptions();
            updateUI();
            setupEventListeners();
        });

        function initTheme() {
            const isDark = localStorage.getItem('smart_expense_theme') === 'dark' ||
                (!('smart_expense_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('smart_expense_theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('smart_expense_theme', 'dark');
            }
            // Re-render charts to support dark mode color change
            renderCharts(getFilteredTransactions());
        }

        function setDefaultMonthFilter() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('filterMonth').value = `${year}-${month}`;
            document.getElementById('formDate').valueAsDate = new Date();
        }

        function saveTransactions() {
            localStorage.setItem('smart_expense_data', JSON.stringify(transactions));
            updateUI();
        }

        function showToast(msg, iconClass = 'fa-circle-check text-emerald-400') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass}`;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
            }, 3000);
        }

        function getFilteredTransactions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('filterType').value;
            const categoryFilter = document.getElementById('filterCategory').value;
            const monthFilter = document.getElementById('filterMonth').value; // YYYY-MM

            return transactions.filter(item => {
                const matchesSearch = item.note.toLowerCase().includes(search) || item.category.toLowerCase().includes(search);
                const matchesType = typeFilter === 'all' || item.type === typeFilter;
                const matchesCategory = categoryFilter === 'all' || item.category === categoryFilter;
                const matchesMonth = !monthFilter || item.date.startsWith(monthFilter);

                return matchesSearch && matchesType && matchesCategory && matchesMonth;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function updateUI() {
            const filtered = getFilteredTransactions();
            renderTable(filtered);
            renderSummary(filtered);
            renderBudget();
            renderCharts(filtered);
        }

        function renderSummary(filteredList) {
            let totalIncome = 0;
            let totalExpense = 0;
            let incCount = 0;
            let expCount = 0;

            filteredList.forEach(item => {
                if (item.type === 'income') {
                    totalIncome += parseFloat(item.amount);
                    incCount++;
                } else {
                    totalExpense += parseFloat(item.amount);
                    expCount++;
                }
            });

            const netBalance = totalIncome - totalExpense;
            const savingsRate = totalIncome > 0 ? Math.max(0, Math.round(((totalIncome - totalExpense) / totalIncome) * 100)) : 0;

            document.getElementById('summaryIncome').textContent = `NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('summaryExpense').textContent = `NT$ ${totalExpense.toLocaleString()}`;
            document.getElementById('summaryNet').textContent = `NT$ ${netBalance.toLocaleString()}`;
            
            document.getElementById('incomeCount').textContent = `${incCount} 筆收入記錄`;
            document.getElementById('expenseCount').textContent = `${expCount} 筆支出記錄`;
            document.getElementById('savingsRate').textContent = `儲蓄率 ${savingsRate}%`;

            document.getElementById('totalFilterCount').textContent = `${filteredList.length} 筆`;
        }

        function renderTable(list) {
            const tableBody = document.getElementById('transactionListTable');
            const emptyState = document.getElementById('emptyState');

            tableBody.innerHTML = '';

            if (list.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            list.forEach(item => {
                const categoryObj = [...CATEGORIES.expense, ...CATEGORIES.income].find(c => c.name === item.category) || { icon: 'fa-receipt', color: '#64748b' };
                const isExpense = item.type === 'expense';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-slate-600 dark:text-slate-300 text-xs sm:text-sm">${item.date}</td>
                    <td class="py-3 px-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-xs" style="background-color: ${categoryObj.color}">
                                <i class="fa-solid ${categoryObj.icon}"></i>
                            </div>
                            <span class="font-semibold text-slate-700 dark:text-slate-200">${item.category}</span>
                        </div>
                    </td>
                    <td class="py-3 px-4 text-slate-500 dark:text-slate-400 hidden sm:table-cell text-xs">${item.payment}</td>
                    <td class="py-3 px-4 text-slate-600 dark:text-slate-300 max-w-xs truncate">${item.note || '-'}</td>
                    <td class="py-3 px-4 text-right font-bold ${isExpense ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'}">
                        ${isExpense ? '-' : '+'}NT$ ${parseFloat(item.amount).toLocaleString()}
                    </td>
                    <td class="py-3 px-4 text-center">
                        <div class="flex items-center justify-center space-x-2">
                            <button onclick="editTransaction('${item.id}')" class="p-1 text-slate-400 hover:text-sky-600 transition" title="編輯">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteTransaction('${item.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition" title="刪除">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function renderBudget() {
            const currentMonth = document.getElementById('filterMonth').value;
            const currentMonthExpenses = transactions
                .filter(t => t.type === 'expense' && t.date.startsWith(currentMonth))
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            const percent = monthlyBudget > 0 ? Math.min(100, Math.round((currentMonthExpenses / monthlyBudget) * 100)) : 0;
            
            const progressBar = document.getElementById('budgetProgressBar');
            const percentText = document.getElementById('budgetPercentText');

            progressBar.style.width = `${percent}%`;
            percentText.textContent = `${percent}%`;

            // Change progress color based on usage
            if (percent < 70) {
                progressBar.className = 'h-full bg-emerald-500 transition-all duration-500';
                percentText.className = 'font-bold text-emerald-600 dark:text-emerald-400';
            } else if (percent < 90) {
                progressBar.className = 'h-full bg-amber-500 transition-all duration-500';
                percentText.className = 'font-bold text-amber-600 dark:text-amber-400';
            } else {
                progressBar.className = 'h-full bg-rose-500 transition-all duration-500';
                percentText.className = 'font-bold text-rose-600 dark:text-rose-400';
            }

            document.getElementById('budgetCurrentExpense').textContent = `已支出: NT$ ${currentMonthExpenses.toLocaleString()}`;
            document.getElementById('budgetTotalAmount').textContent = `目標預算: NT$ ${monthlyBudget.toLocaleString()}`;
        }

        function renderCharts(filteredList) {
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';
            const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';

            // 1. Category Pie/Doughnut Chart
            const categoryTotals = {};
            filteredList.filter(t => t.type === 'expense').forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + parseFloat(t.amount);
            });

            const pieLabels = Object.keys(categoryTotals);
            const pieData = Object.values(categoryTotals);
            const pieColors = pieLabels.map(label => {
                const match = CATEGORIES.expense.find(c => c.name === label);
                return match ? match.color : '#cbd5e1';
            });

            const ctxCategory = document.getElementById('categoryChart').getContext('2d');
            if (categoryChartInstance) categoryChartInstance.destroy();

            categoryChartInstance = new Chart(ctxCategory, {
                type: 'doughnut',
                data: {
                    labels: pieLabels.length ? pieLabels : ['尚無支出'],
                    datasets: [{
                        data: pieData.length ? pieData : [1],
                        backgroundColor: pieColors.length ? pieColors : ['#e2e8f0'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: textColor, font: { size: 11 } }
                        }
                    },
                    cutout: '65%'
                }
            });

            // 2. Trend Line Chart
            const periodMode = document.getElementById('chartPeriodSelect').value;
            const dateAgg = {};

            if (periodMode === 'month') {
                // Group by date in the filtered list
                filteredList.forEach(t => {
                    const day = t.date;
                    if (!dateAgg[day]) dateAgg[day] = { income: 0, expense: 0 };
                    if (t.type === 'income') dateAgg[day].income += parseFloat(t.amount);
                    else dateAgg[day].expense += parseFloat(t.amount);
                });
            } else {
                // Group by YYYY-MM
                filteredList.forEach(t => {
                    const month = t.date.substring(0, 7);
                    if (!dateAgg[month]) dateAgg[month] = { income: 0, expense: 0 };
                    if (t.type === 'income') dateAgg[month].income += parseFloat(t.amount);
                    else dateAgg[month].expense += parseFloat(t.amount);
                });
            }

            const sortedDates = Object.keys(dateAgg).sort();
            const incomeSeries = sortedDates.map(d => dateAgg[d].income);
            const expenseSeries = sortedDates.map(d => dateAgg[d].expense);

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();

            trendChartInstance = new Chart(ctxTrend, {
                type: 'bar',
                data: {
                    labels: sortedDates.length ? sortedDates : ['無資料'],
                    datasets: [
                        {
                            label: '收入',
                            data: incomeSeries.length ? incomeSeries : [0],
                            backgroundColor: '#10b981',
                            borderRadius: 6
                        },
                        {
                            label: '支出',
                            data: expenseSeries.length ? expenseSeries : [0],
                            backgroundColor: '#ef4444',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            ticks: { color: textColor, font: { size: 10 } },
                            grid: { display: false }
                        },
                        y: {
                            ticks: { color: textColor, font: { size: 10 } },
                            grid: { color: gridColor }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { color: textColor, font: { size: 11 } }
                        }
                    }
                }
            });
        }

        function renderCategoryOptions() {
            const currentType = document.getElementById('formType').value;
            const categorySelect = document.getElementById('formCategory');
            categorySelect.innerHTML = '';

            CATEGORIES[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = cat.name;
                categorySelect.appendChild(opt);
            });
        }

        function renderFilterCategoryOptions() {
            const filterCatSelect = document.getElementById('filterCategory');
            filterCatSelect.innerHTML = '<option value="all">所有類別</option>';

            const allCats = [...CATEGORIES.expense, ...CATEGORIES.income];
            allCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = cat.name;
                filterCatSelect.appendChild(opt);
            });
        }

        function openModal(isEdit = false) {
            const modal = document.getElementById('transactionModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.firstElementChild.classList.remove('scale-95');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
            if (!isEdit) {
                document.getElementById('transactionForm').reset();
                document.getElementById('editIndex').value = '-1';
                document.getElementById('modalTitle').textContent = '新增記帳項目';
                setFormType('expense');
                document.getElementById('formDate').valueAsDate = new Date();
            }
        }

        function closeModal() {
            const modal = document.getElementById('transactionModal');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }

        function setFormType(type) {
            document.getElementById('formType').value = type;
            const tabExpense = document.getElementById('tabExpense');
            const tabIncome = document.getElementById('tabIncome');

            if (type === 'expense') {
                tabExpense.className = 'py-2 rounded-lg font-semibold text-xs text-center transition bg-white dark:bg-slate-700 shadow text-rose-600 dark:text-rose-400';
                tabIncome.className = 'py-2 rounded-lg font-semibold text-xs text-center transition text-slate-500 dark:text-slate-400';
            } else {
                tabIncome.className = 'py-2 rounded-lg font-semibold text-xs text-center transition bg-white dark:bg-slate-700 shadow text-emerald-600 dark:text-emerald-400';
                tabExpense.className = 'py-2 rounded-lg font-semibold text-xs text-center transition text-slate-500 dark:text-slate-400';
            }
            renderCategoryOptions();
        }

        function editTransaction(id) {
            const item = transactions.find(t => t.id === id);
            if (!item) return;

            document.getElementById('editIndex').value = item.id;
            document.getElementById('modalTitle').textContent = '編輯記帳項目';
            setFormType(item.type);
            document.getElementById('formAmount').value = item.amount;
            document.getElementById('formCategory').value = item.category;
            document.getElementById('formDate').value = item.date;
            document.getElementById('formPayment').value = item.payment;
            document.getElementById('formNote').value = item.note;

            openModal(true);
        }

        function deleteTransaction(id) {
            if (confirm('確定要刪除這筆記帳資料嗎？')) {
                transactions = transactions.filter(t => t.id !== id);
                saveTransactions();
                showToast('項目已順利刪除', 'fa-circle-xmark text-rose-400');
            }
        }

        function setupEventListeners() {
            // Dark Mode Toggle
            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

            // Modal Controls
            document.getElementById('btnOpenAddModal').addEventListener('click', () => openModal(false));
            document.getElementById('btnCloseModal').addEventListener('click', closeModal);

            // Form Tabs
            document.getElementById('tabExpense').addEventListener('click', () => setFormType('expense'));
            document.getElementById('tabIncome').addEventListener('click', () => setFormType('income'));

            // Form Submit
            document.getElementById('transactionForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const editId = document.getElementById('editIndex').value;
                const type = document.getElementById('formType').value;
                const amount = parseFloat(document.getElementById('formAmount').value);
                const category = document.getElementById('formCategory').value;
                const date = document.getElementById('formDate').value;
                const payment = document.getElementById('formPayment').value;
                const note = document.getElementById('formNote').value;

                if (editId !== '-1') {
                    // Update
                    const idx = transactions.findIndex(t => t.id === editId);
                    if (idx !== -1) {
                        transactions[idx] = { id: editId, type, amount, category, date, payment, note };
                        showToast('已更新記帳項目');
                    }
                } else {
                    // Create New
                    const newTransaction = {
                        id: 'tx_' + Date.now(),
                        type,
                        amount,
                        category,
                        date,
                        payment,
                        note
                    };
                    transactions.push(newTransaction);
                    showToast('已成功新增記帳！');
                }

                saveTransactions();
                closeModal();
            });

            // Filters Trigger
            ['searchInput', 'filterType', 'filterCategory', 'filterMonth', 'chartPeriodSelect'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateUI);
                document.getElementById(id).addEventListener('change', updateUI);
            });

            // Budget Edit Trigger
            document.getElementById('btnSetBudget').addEventListener('click', () => {
                const input = prompt('請輸入本月總支出預算金額 (NT$):', monthlyBudget);
                if (input !== null && !isNaN(parseFloat(input)) && parseFloat(input) >= 0) {
                    monthlyBudget = parseFloat(input);
                    localStorage.setItem('smart_expense_budget', monthlyBudget);
                    renderBudget();
                    showToast('已更新本月預算金額');
                }
            });

            // Load Sample Data
            document.getElementById('btnSampleData').addEventListener('click', loadSampleData);

            // Export CSV & JSON
            document.getElementById('btnExportJSON').addEventListener('click', exportJSON);
            document.getElementById('btnExportCSV').addEventListener('click', exportCSV);
            document.getElementById('importFileInput').addEventListener('change', importJSON);
        }

        function loadSampleData() {
            const today = new Date();
            const yearMonth = today.toISOString().substring(0, 7);

            const sample = [
                { id: 'sample_1', type: 'income', amount: 55000, category: '工作薪資', date: `${yearMonth}-01`, payment: '銀行轉帳', note: '正職月薪發放' },
                { id: 'sample_2', type: 'expense', amount: 15000, category: '居住水電', date: `${yearMonth}-02`, payment: '銀行轉帳', note: '房屋租金' },
                { id: 'sample_3', type: 'expense', amount: 180, category: '餐飲食品', date: `${yearMonth}-03`, payment: 'LINE Pay', note: '拉麵午餐' },
                { id: 'sample_4', type: 'expense', amount: 1200, category: '交通出行', date: `${yearMonth}-05`, payment: '悠遊卡', note: '捷運月票加值' },
                { id: 'sample_5', type: 'expense', amount: 3200, category: '購物消費', date: `${yearMonth}-08`, payment: '信用卡', note: '買春季外套' },
                { id: 'sample_6', type: 'income', amount: 5000, category: '副業兼職', date: `${yearMonth}-10`, payment: '銀行轉帳', note: '接案設計費' },
                { id: 'sample_7', type: 'expense', amount: 650, category: '休閒娛樂', date: `${yearMonth}-12`, payment: '現金', note: '威秀看電影' }
            ];

            transactions = [...sample, ...transactions];
            saveTransactions();
            showToast('已成功匯入範例資料！');
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `smart_expense_backup_${new Date().toISOString().substring(0,10)}.json`);
            dlAnchorElem.click();
            showToast('已導出 JSON 備份檔');
        }

        function exportCSV() {
            let csvContent = "\uFEFF"; // UTF-8 BOM
            csvContent += "ID,類型,金額,類別,日期,支付管道,備註\n";

            transactions.forEach(t => {
                csvContent += `"${t.id}","${t.type === 'income' ? '收入' : '支出'}","${t.amount}","${t.category}","${t.date}","${t.payment}","${t.note || ''}"\n`;
            });

            const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `smart_expense_records_${new Date().toISOString().substring(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('已導出 CSV 報表');
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (Array.isArray(importedData)) {
                        transactions = importedData;
                        saveTransactions();
                        showToast('成功導入備份資料！');
                    } else {
                        alert('檔案格式不正確');
                    }
                } catch (err) {
                    alert('讀取 JSON 檔案失敗');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
